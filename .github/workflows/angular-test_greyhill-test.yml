# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: UI Test - greyhill-test

on:
  push:
    branches:
      #- angular-test
      - develop
  workflow_dispatch:

jobs:
  build-angular:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install
        working-directory: client
        run: npm install

      - name: ng build test
        working-directory: client
        run: npx ng build --configuration test 
        #run: npx ng build --configuration production 
        #run: ng build --configuration production nefungovalo na github actions

      - name: Create ZIP artifact
        working-directory: client
        run: |
          if [ -d "dist" ]; then
            cd dist && zip -r ../release.zip . && cd ..
          else
            echo "ERROR: dist directory not found. Build may have failed."
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: client/release.zip

  deploy-angular:
    runs-on: ubuntu-latest
    needs: build-angular
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: angular-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC756FAC3FA94B25B423984E3EA5B69F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4525C3723730411E91B04104479B51A4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D91CF68370A040DEB3666365DAD39685 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'greyhill-test'
          slot-name: 'Production'
          package: ./
          