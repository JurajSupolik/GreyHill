# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# web appp | General settings| Stack settings | Startup command = pm2 serve /home/site/wwwroot/greyhill/browser/ --no-daemon


name: UI Angular - greyhill

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-angular:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install
        working-directory: client
        run: npm install

      - name: ng build production
        working-directory: client
        run: npx ng build --configuration production #nefungovalo na github actions
        #run: ng build --configuration production

      - name: Create ZIP artifact
        working-directory: client
        run: |
          if [ -d "dist" ]; then
            cd dist && zip -r ../release.zip . && cd ..
          else
            echo "ERROR: dist directory not found. Build may have failed."
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: client/release.zip

  deploy-angular:
    runs-on: ubuntu-latest
    needs: build-angular
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: angular-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_95EBABD228A447E885021C8984A123A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_437A75DEBC5F41D5809FF50347EC7642 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2C2F92DD412A4F3DB5FB18DEA4377D35 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-angular-app
        with:
          app-name: 'greyhill'
          slot-name: 'Production'
          package: ./
