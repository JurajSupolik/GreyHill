<mat-card class="apartment-card">
  <img mat-card-image [src]="apartment.image_url" [alt]="apartment.name">
  
  <mat-card-header>
    <mat-card-title>{{ apartment.name }}</mat-card-title>
    <mat-card-subtitle>{{ apartment.city }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="description">{{ apartment.description }}</p>
    
    <div class="apartment-details">
      <div class="detail-item">
        <mat-icon>people</mat-icon>
        <span>{{ apartment.capacity }} osôb</span>
      </div>
      <div class="detail-item">
        <mat-icon>bed</mat-icon>
        <span>{{ apartment.bedrooms }} izby</span>
      </div>
      <div class="detail-item">
        <mat-icon>bathroom</mat-icon>
        <span>{{ apartment.bathrooms }} kúpeľňa</span>
      </div>
    </div>

    <div class="amenities">
      <mat-chip-set>
        <mat-chip *ngFor="let amenity of apartment.amenities.slice(0, 3)">
          {{ amenity }}
        </mat-chip>
      </mat-chip-set>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <div class="price-section">
      <span class="price">{{ apartment.price_per_night }}€</span>
      <span class="per-night">/noc</span>
    </div>
    <button mat-raised-button color="primary" [routerLink]="['/apartments', apartment.id]">Detail</button>
  </mat-card-actions>
</mat-card>
