<!-- src/app/components/header/header.component.html -->

<mat-toolbar color="primary" class="header">
  <div class="header-content">
    <div class="logo" routerLink="/">
      <mat-icon>apartment</mat-icon>
      <span class="logo-text">Greyhill</span>
    </div>

    <nav class="nav-menu">
      <a mat-button routerLink="/">Domov</a>
      <a mat-button routerLink="/apartments">Apartmány</a>
      <a mat-button routerLink="/about">O nás</a>
      <a mat-button routerLink="/contact">Kontakt</a>
    </nav>

    <div class="header-actions">
      @if (currentUser) {
        <!-- Prihlásený používateľ -->
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          {{ currentUser.username }}
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item disabled>
            <mat-icon>email</mat-icon>
            <span>{{ currentUser.email }}</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Môj profil</span>
          </button>
          <button mat-menu-item *ngIf="currentUser.is_admin" routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Admin panel</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Odhlásiť sa</span>
          </button>
        </mat-menu>
      } @else {
        <!-- Neprihlásený používateľ -->
        <a mat-button routerLink="/login">
          <mat-icon>login</mat-icon>
          Prihlásiť
        </a>
        <a mat-raised-button color="accent" routerLink="/register">
          Registrovať
        </a>
      }
    </div>
  </div>
</mat-toolbar>
